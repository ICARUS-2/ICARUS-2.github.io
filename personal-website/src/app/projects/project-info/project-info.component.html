<div class="projectInfoOuter"   [style.background-image]="'linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url(' + backgroundImageSource + ')'" style="background-size: cover;width: 100%; height: 700px; display: flex; justify-content: center; align-items: center;">
    <div class="shadow projectInfoInner" style="min-height: 400px; max-height: 700px; background-color: rgb(40,40,40); width: 70%; display: flex; flex-direction: column ;justify-content: center; padding: 40px; margin-left: 30%;">
        <h1 class="thinHeader colorBlue bg-transparent">{{header}}</h1>
        <p class="bg-transparent" [innerHTML]="description"></p>

        <app-main-button-href class="bg-transparent" [text]="btnText" [href]="btnHref"></app-main-button-href>
    </div>

</div>
